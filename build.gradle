plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    implementation group: 'dev.langchain4j', name: 'langchain4j', version: '0.35.0'
    implementation group: 'dev.langchain4j', name: 'langchain4j-open-ai', version: '0.35.0'
    implementation group: 'org.springframework.boot', name: 'spring-boot-devtools', version: '3.3.5'
    implementation group: 'dev.langchain4j', name: 'langchain4j-document-parser-apache-pdfbox', version: '0.32.0'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
